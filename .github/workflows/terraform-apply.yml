name: Terraform Apply (Infrastructure)

# Applies infra/azure/environments/dev after a change to infra/azure/**
# lands on main, or on demand via workflow_dispatch. Split into two jobs on
# purpose:
#
#   plan  -- runs immediately, no gate. Produces the exact plan that would
#            be applied and saves it as an artifact.
#   apply -- gated by the `dev-infra` GitHub Environment's required
#            reviewer rule. The approver reviews the *plan job's already-
#            finished output* (same workflow run) before clicking approve;
#            once approved, this job applies the saved plan file verbatim
#            rather than re-planning, so what gets approved is exactly
#            what gets applied.
#
# See "How infrastructure changes are reviewed" in
# docs/automated-azure-infrastructure.md for the full picture (this is the
# second review gate -- the PR merge that got the change onto main in the
# first place is the first).

on:
  push:
    branches: [main]
    paths:
      - "infra/azure/**"
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: "Backend image tag to deploy (overrides the BACKEND_IMAGE_TAG repo variable)"
        required: false
        type: string
      frontend_image_tag:
        description: "Frontend image tag to deploy (overrides the FRONTEND_IMAGE_TAG repo variable)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: infra/azure/environments/dev

env:
  TF_VERSION: "1.16.0"
  TF_IN_AUTOMATION: "true"

# Only one apply (and its preceding plan) in flight at a time. Queued, not
# cancelled -- an in-progress apply must never be killed mid-change, and a
# queued run always re-plans against the state the run ahead of it left
# behind, so stacked pushes stay correct without needing to be squashed.
concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

jobs:
  plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.exit_code == '2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC, read-only)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=novacart-dev.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID_PLAN }}"

      - name: terraform plan
        id: plan
        env:
          TF_VAR_postgres_administrator_password: ${{ secrets.TF_VAR_POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -no-color -detailed-exitcode \
            -var="backend_image_tag=${{ inputs.backend_image_tag || vars.BACKEND_IMAGE_TAG }}" \
            -var="frontend_image_tag=${{ inputs.frontend_image_tag || vars.FRONTEND_IMAGE_TAG }}" \
            -out=tfplan > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "DEBUG: terraform plan exited with code $code" >&2
          # 0 = no changes, 1 = error, 2 = changes pending. Only 1 should
          # fail the job -- 0 and 2 are both legitimate plan outcomes.
          if [ "$code" = "1" ]; then exit 1; fi

      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo "### Terraform plan -- \`infra/azure/environments/dev\` (from ${{ github.sha }})"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/azure/environments/dev/tfplan
          retention-days: 1

  apply:
    name: terraform apply (dev)
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: dev-infra # <- required-reviewer gate lives on this environment
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC, read-write)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=novacart-dev.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID_APPLY }}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/azure/environments/dev

      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Publish outputs to job summary
        if: always()
        run: |
          {
            echo "### Apply complete -- outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

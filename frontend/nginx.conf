server {
    listen 80;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # Forward any /api/* request to the backend container.
    # "backend" is resolved via Docker's internal network — it matches
    # the service name defined in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
 
    # Serve static files directly; fall back to index.html for
    # any unmatched route.
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}